<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
</head>
<body>
  <p>HTML에서 JavaScript를 실행하는 예제입니다.</p>

  <!-- 짧은 코드는 HTML 안에 직접 작성할 수 있다. -->

    console.log("HTML 안에서 실행한 코드"); // Console: HTML 안에서 실행한 코드
  </script>

  <!-- 코드가 길어지면 별도 파일로 분리할 수 있다. -->
  <script src="./helloWorld.js"></script>
</body>
</html>
